<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AroidNode — Botanical Legal & Curatorial Archive</title>
  <style>
    :root {
      --bg: #FBF9F5;
      --card-bg: #FFFFFF;
      --text-main: #1C241D;
      --text-muted: #5C6E60;
      --accent: #1B4332;
      --accent-light: #2D6A4F;
      --border: #E5EADF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121814;
        --card-bg: #1A221C;
        --text-main: #F0F4F1;
        --text-muted: #95A599;
        --accent: #52B788;
        --accent-light: #74C69D;
        --border: #2B3A2E;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(82, 183, 136, 0.15);
      padding: 5px 14px;
      border-radius: 99px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: var(--accent-light);
    }
    .btn-secondary {
      background: rgba(82, 183, 136, 0.1);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(82, 183, 136, 0.2);
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Legal Documentation</span>
    <h1>AroidNode</h1>
    <p>Luxury rare plant collection tracker, node propagation lineage, and botanical accession archive.</p>

    <div class="links">
      <a class="btn btn-primary" href="privacy-policy.html">Privacy Policy</a>
      <a class="btn btn-secondary" href="terms-of-service.html">Terms of Service</a>
    </div>

    <div class="footer">
      Developer Contact: <a href="mailto:support@aroidnode.com" style="color: inherit;">support@aroidnode.com</a><br>
      Package: <code>com.aroidnode</code>
    </div>
  </div>
</body>
</html>
